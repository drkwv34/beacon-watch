name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
          POSTGRES_DB: beacon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beacon -d beacon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CI: 'true'
      DATABASE_URL: postgresql://beacon:beacon@localhost:5432/beacon_test
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: replace-me-with-at-least-32-random-characters
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm (version from packageManager)
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  compose:
    name: compose config · images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose --env-file .env.example config --quiet
      - name: Build images
        run: docker compose build

  # Do not delete, skip, or set continue-on-error on this job (NFR-MAINT-001).
  e2e:
    name: playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLIC_RATE_LIMIT_PER_MIN: '1000'
      E2E_TARGET_URL: http://mock-target:8080/health
      MOCK_TARGET_URL: http://127.0.0.1:8080
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      SCREENSHOT_DIR: playwright-screenshots
      DEMO_PASSWORD: demo-password-change-me
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm (version from packageManager)
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start Compose stack
        run: docker compose --env-file .env.example up -d --wait --wait-timeout 120 --build
      - name: Wait for web
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'web did not become ready'
          docker compose --env-file .env.example logs
          exit 1
      - name: Seed Appendix D demo
        env:
          DATABASE_URL: postgresql://beacon:beacon-local-only@127.0.0.1:5432/beacon
          DEMO_PASSWORD: demo-password-change-me
          DEMO_GRACE_THRESHOLD: '1'
          DEMO_RECOVERY_THRESHOLD: '1'
        run: pnpm seed
      - run: pnpm test:e2e
      - name: Dump Compose logs
        if: failure()
        run: |
          docker compose --env-file .env.example ps -a
          docker compose --env-file .env.example logs
      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-screenshots/
          if-no-files-found: ignore
      - name: Stop Compose stack
        if: always()
        run: docker compose --env-file .env.example down -v
